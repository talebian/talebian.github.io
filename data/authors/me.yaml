bio: |
  I'm a cosmologist who decodes the universe's largest mysteries—dark energy, dark matter, and cosmic inflation—to 
  help professionals navigate the most complex system of all: the human mind. My research, published in ApJ, PRD, 
  JCAP, JHEP, and PDU (1000+ citations), explores the fundamental laws of nature. But the most profound law I've discovered? 
  Impact isn't measured by citations; it's measured by lives transformed. That's why I bridge the rigor of astrophysics 
  with the art of living—coaching thinkers to cultivate clarity, resilience, and purpose.



